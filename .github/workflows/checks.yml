name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git diff --check
      - run: python scripts/check_docs.py
